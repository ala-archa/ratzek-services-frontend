# Public weather-forecast page on a dedicated port of the internet gateway
# (vpn.lepikhin.site / 82.146.59.228). Lives on the GATEWAY, not the mountain
# prod. This file is the source of truth — deployed to
# /etc/nginx/sites-enabled/ratzek-portal-public.conf on the gateway by hand
# (the gateway is not under a config-management tool). See DEPLOY.md.
#
# It proxies ONLY the forecast page + its assets + latest.json to the mountain
# portal (server_name www.ratzek) over the VPN. Everything else -> 404
# (allowlist), so /api, /ap-admin, donate.html, the captive index, /library,
# /webcam-archive, /guides, /forecasts and any future portal path stay private.
#
# The public :8080, the SSH control path (:5000 -> mountain:22) and Grafana (:80)
# all share ONE narrow satellite VPN, so we cache static on the gateway and
# rate-limit :8080 to keep abuse from saturating the tunnel and cutting off
# control of the mountain server.

proxy_cache_path /var/cache/nginx-ratzek levels=1:2 keys_zone=ratzek_static:10m
                 max_size=200m inactive=24h;
limit_req_zone  $binary_remote_addr zone=ratzek_rl:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=ratzek_cc:10m;

upstream ratzek_portal {
  server 10.8.0.10:80;
  keepalive 8;
}

server {
  listen 8080;
  server_name _;
  root /no_entry/;

  access_log /var/log/nginx/ratzek-public.access.log;
  error_log  /var/log/nginx/ratzek-public.error.log warn;

  # Protect the narrow VPN from scrapers/bots.
  limit_req  zone=ratzek_rl burst=20 nodelay;
  limit_conn ratzek_cc 8;

  # Proxy defaults for the high-latency VPN link to the mountain.
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host www.ratzek;   # route to the portal vhost; do NOT forward client IP
  proxy_connect_timeout 5s;
  proxy_read_timeout 15s;
  proxy_send_timeout 15s;
  proxy_next_upstream off;
  error_page 502 503 504 = @down;

  # Entry point -> the forecast page.
  location = / { return 302 /weather-forecast.html; }

  # ── ALLOWLIST ──────────────────────────────────────────────────────────
  location = /weather-forecast.html { proxy_pass http://ratzek_portal; }

  # Forecast JSON: never cache (freshness); no-store from the origin is passed through.
  location = /weather/latest.json   { proxy_pass http://ratzek_portal; }

  # Static assets: cache on the gateway (origin sends no-store, so we override it
  # here) — otherwise ~730 KB of fonts+JS crosses the VPN on every cold visit.
  # Fonts and images: they change only when the site is redesigned, so a long
  # TTL is free. ~700 KB of fonts is most of the page weight over this link.
  location ~* ^/assets/ {
    proxy_pass http://ratzek_portal;
    proxy_cache ratzek_static;
    proxy_ignore_headers Cache-Control Expires;
    proxy_cache_valid 200 24h;
    proxy_cache_revalidate on;
    proxy_cache_use_stale error timeout updating http_502 http_504;
    add_header X-Cache-Status $upstream_cache_status;
  }

  # Page code: js/css change on every deploy, and weather-forecast.html is NOT
  # cached here — so the original 1h TTL meant the gateway served a fresh page
  # against an hour-old stylesheet, which renders as a visibly broken layout
  # rather than as an honestly old version. 1m bounds that mismatch.
  #
  # `proxy_cache_revalidate` is set but is currently INERT: the origin is a
  # captive portal and deliberately defeats validators —
  # `add_header Last-Modified $date_gmt` (request time, not the file's mtime),
  # `if_modified_since off`, `etag off` in web.ratzek.conf. So an expiry costs a
  # full refetch (~134 KB for js+css), once per minute at most and only when
  # someone actually asks. Left in place so this turns into cheap 304s for free
  # if the origin ever serves real validators for /js/ and /css/.
  location ~* ^/(js|css)/ {
    proxy_pass http://ratzek_portal;
    proxy_cache ratzek_static;
    proxy_ignore_headers Cache-Control Expires;
    proxy_cache_valid 200 1m;
    proxy_cache_revalidate on;
    proxy_cache_use_stale error timeout updating http_502 http_504;
    add_header X-Cache-Status $upstream_cache_status;
  }

  # Everything else is private by default.
  location / { return 404; }

  location @down { return 503; }
}
